services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrisnap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
      POSTGRES_DB: ${DB_NAME:-nutrisnap_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - nutrisnap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nutrisnap_pgdata:
    driver: local
